<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="top-bar">
      <h1>Expense & Budget Visualizer</h1>
      <button type="button" id="theme-toggle" class="btn-theme" aria-label="Toggle dark mode">Dark mode</button>
    </header>

    <!-- Total balance -->
    <section class="card balance-card">
      <p class="balance-label">Total balance</p>
      <h2 id="total-balance" class="balance-amount">$0.00</h2>
      <p id="limit-warning" class="limit-warning" hidden></p>
    </section>

    <!-- Form -->
    <section class="card">
      <h3>Add transaction</h3>
      <form id="transaction-form" novalidate>
        <label for="item-name">Item name</label>
        <input type="text" id="item-name" placeholder="e.g. Lunch">

        <label for="amount">Amount</label>
        <input type="number" id="amount" step="0.01" min="0" placeholder="0.00">

        <label for="category">Category</label>
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>

        <p id="form-error" class="form-error" role="alert"></p>
        <button type="submit" class="btn-primary">Add transaction</button>
      </form>
    </section>

    <!-- Spending limit (optional feature) -->
    <section class="card">
      <h3>Spending limit</h3>
      <p class="hint">Transactions above this amount are highlighted. Leave empty for no limit.</p>
      <input type="number" id="limit-input" step="0.01" min="0" placeholder="e.g. 50">
    </section>

    <div class="grid">
      <section class="card">
        <div class="list-header">
          <h3>Transactions</h3>
          <select id="sort-select" aria-label="Sort transactions">
            <option value="newest">Newest first</option>
            <option value="amount-desc">Amount: high to low</option>
            <option value="amount-asc">Amount: low to high</option>
            <option value="category">Category (A–Z)</option>
          </select>
        </div>
        <ul id="transaction-list" class="transaction-list"></ul>
      </section>

      <section class="card">
        <h3>Spending by category</h3>
        <div class="chart-wrapper">
          <canvas id="spending-chart"></canvas>
          <p id="chart-empty" class="empty-message">Add a transaction to see the chart.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
